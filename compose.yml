services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gml-shield-api:dev
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  queue-worker:
    image: gml-shield-api:dev
    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=audit
      - --sleep=1
      - --tries=3
      - --timeout=60
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - internal

  broadcast-worker:
    image: gml-shield-api:dev
    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=broadcasts
      - --sleep=1
      - --tries=3
      - --timeout=60
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - internal

  reverb:
    image: gml-shield-api:dev
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:18.2-trixie
    environment:
      POSTGRES_DB: gml_shield
      POSTGRES_USER: gml_shield
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gml_shield -d gml_shield"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gml-shield-front:dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  laravel_storage:
  laravel_cache:
